<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Neon - Controle de Gastos</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

:root {
  --bg: #070B14;
  --bg-card: rgba(15, 23, 42, 0.6);
  --bg-card-hover: rgba(30, 41, 59, 0.7);
  --neon-green: #00FFA3;
  --neon-cyan: #00F0FF;
  --neon-pink: #FF00FF;
  --neon-blue: #3B82F6;
  --neon-red: #FF3864;
  --neon-yellow: #FFE600;
  --text: #E2E8F0;
  --text-muted: #94A3B8;
  --border: rgba(148, 163, 184, 0.1);
  --shadow-sm: 0 0 10px;
  --shadow-md: 0 0 20px;
  --shadow-lg: 0 0 30px;
  --radius: 16px;
  --radius-sm: 12px;
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  background-image: 
    radial-gradient(circle at 20% 20%, rgba(0, 255, 163, 0.08) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(255, 0, 255, 0.08) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.05) 0%, transparent 50%);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 100px;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 16px;
}

header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(7, 11, 20, 0.8);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  margin-bottom: 24px;
  padding: 16px 0;
}

.header-content {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  padding: 0 16px;
}

.app-title h1 {
  font-size: 1.5rem;
  background: linear-gradient(135deg, var(--neon-cyan), var(--neon-green));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.stats-bar {
  display: flex;
  gap: 8px;
  padding: 0 16px;
}

.stat-btn {
  flex: 1;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 8px;
  text-align: center;
}

.stat-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
.stat-value { font-size: 1.1rem; font-weight: 700; }
.stat-btn.gasto .stat-value { color: var(--neon-pink); }
.stat-btn.pendente .stat-value { color: var(--neon-yellow); }
.stat-btn.pagar .stat-value { color: var(--neon-green); }

/* Expense List */
.expenses-grid {
  display: grid;
  gap: 16px;
  margin-top: 20px;
}

.expense-card {
  background: var(--bg-card);
  backdrop-filter: blur(10px);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  position: relative;
  transition: var(--transition);
}

.expense-card.pago { border-left: 4px solid var(--neon-green); }
.expense-card.pendente { border-left: 4px solid var(--neon-red); }

.card-header { display: flex; justify-content: space-between; align-items: flex-start; }
.card-value { font-size: 1.4rem; font-weight: 700; }
.pago .card-value { color: var(--neon-green); }
.pendente .card-value { color: var(--neon-red); }

.card-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}

.btn {
  flex: 1;
  padding: 8px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.05);
  color: white;
  cursor: pointer;
  font-size: 0.8rem;
  font-weight: 600;
  transition: 0.2s;
}

.btn-neon-blue { border-color: var(--neon-blue); color: var(--neon-blue); }
.btn-neon-red { border-color: var(--neon-red); color: var(--neon-red); }
.btn-neon-green { border-color: var(--neon-green); color: var(--neon-green); }

.fab {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--neon-cyan), var(--neon-green));
  border: none;
  font-size: 2rem;
  color: var(--bg);
  box-shadow: 0 0 20px var(--neon-cyan);
  cursor: pointer;
  z-index: 99;
}

/* Modal */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(5px);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal.show { display: flex; }

.modal-content {
  background: #0f172a;
  padding: 24px;
  border-radius: 16px;
  width: 100%;
  max-width: 400px;
  border: 1px solid var(--neon-cyan);
}

.form-group { margin-bottom: 15px; }
.form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px; }
.form-input {
  width: 100%;
  padding: 10px;
  background: rgba(0,0,0,0.3);
  border: 1px solid var(--border);
  color: white;
  border-radius: 8px;
}
</style>
</head>
<body>

<header>
  <div class="header-content">
    <div class="app-title">
      <h1>Finance Neon</h1>
      <p>Gerenciamento Inteligente</p>
    </div>
  </div>
  <div class="stats-bar">
    <div class="stat-btn gasto">
      <div class="stat-label">Total</div>
      <div class="stat-value" id="total-geral">R$ 0,00</div>
    </div>
    <div class="stat-btn pendente">
      <div class="stat-label">Pendentes</div>
      <div class="stat-value" id="total-pendente">R$ 0,00</div>
    </div>
    <div class="stat-btn pagar">
      <div class="stat-label">Pagos</div>
      <div class="stat-value" id="total-pago">R$ 0,00</div>
    </div>
  </div>
</header>

<div class="container">
  <div id="expenses-list" class="expenses-grid">
    <!-- Despesas aparecem aqui -->
  </div>
</div>

<button class="fab" onclick="openModal()">+</button>

<!-- Modal Add/Edit -->
<div id="modal" class="modal">
  <div class="modal-content">
    <h2 id="modal-title" style="margin-bottom: 20px; color: var(--neon-cyan);">Nova Despesa</h2>
    <input type="hidden" id="edit-id">
    <div class="form-group">
      <label>Descrição</label>
      <input type="text" id="desc" class="form-input" placeholder="Ex: Aluguel">
    </div>
    <div class="form-group">
      <label>Valor (R$)</label>
      <input type="number" id="val" class="form-input" placeholder="0.00">
    </div>
    <div class="form-group">
      <label>Data</label>
      <input type="date" id="date" class="form-input">
    </div>
    <div style="display: flex; gap: 10px; margin-top: 20px;">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn" style="background: var(--neon-cyan); color: black;" onclick="saveExpense()">Salvar</button>
    </div>
  </div>
</div>

<script>
  let expenses = JSON.parse(localStorage.getItem('expenses')) || [];

  function openModal(id = null) {
    const modal = document.getElementById('modal');
    const title = document.getElementById('modal-title');
    const editId = document.getElementById('edit-id');
    
    if (id !== null) {
      const item = expenses.find(e => e.id === id);
      title.innerText = "Editar Despesa";
      editId.value = id;
      document.getElementById('desc').value = item.description;
      document.getElementById('val').value = item.value;
      document.getElementById('date').value = item.date;
    } else {
      title.innerText = "Nova Despesa";
      editId.value = "";
      document.getElementById('desc').value = "";
      document.getElementById('val').value = "";
      document.getElementById('date').value = new Date().toISOString().split('T')[0];
    }
    modal.classList.add('show');
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('show');
  }

  function saveExpense() {
    const id = document.getElementById('edit-id').value;
    const description = document.getElementById('desc').value;
    const value = parseFloat(document.getElementById('val').value);
    const date = document.getElementById('date').value;

    if (!description || !value) return alert("Preencha os campos!");

    if (id) {
      // Editar existente
      const index = expenses.findIndex(e => e.id == id);
      expenses[index] = { ...expenses[index], description, value, date };
    } else {
      // Nova despesa
      const newExpense = {
        id: Date.now(),
        description,
        value,
        date,
        status: 'pendente'
      };
      expenses.push(newExpense);
    }

    render();
    closeModal();
  }

  function deleteExpense(id) {
    expenses = expenses.filter(e => e.id !== id);
    render();
  }

  function toggleStatus(id) {
    const index = expenses.findIndex(e => e.id === id);
    expenses[index].status = expenses[index].status === 'pago' ? 'pendente' : 'pago';
    render();
  }

  function render() {
    localStorage.setItem('expenses', JSON.stringify(expenses));
    const list = document.getElementById('expenses-list');
    list.innerHTML = "";

    let total = 0, pago = 0, pendente = 0;

    expenses.forEach(e => {
      total += e.value;
      if (e.status === 'pago') pago += e.value;
      else pendente += e.value;

      list.innerHTML += `
        <div class="expense-card ${e.status}">
          <div class="card-header">
            <div>
              <small style="color: var(--text-muted)">${e.date}</small>
              <h3>${e.description}</h3>
            </div>
            <div class="card-value">R$ ${e.value.toFixed(2)}</div>
          </div>
          <div class="card-actions">
            <button class="btn btn-neon-green" onclick="toggleStatus(${e.id})">
              ${e.status === 'pago' ? 'Desmarcar' : 'Pagar'}
            </button>
            <button class="btn btn-neon-blue" onclick="openModal(${e.id})">Editar</button>
            <button class="btn btn-neon-red" onclick="deleteExpense(${e.id})">Excluir</button>
          </div>
        </div>
      `;
    });

    document.getElementById('total-geral').innerText = `R$ ${total.toFixed(2)}`;
    document.getElementById('total-pago').innerText = `R$ ${pago.toFixed(2)}`;
    document.getElementById('total-pendente').innerText = `R$ ${pendente.toFixed(2)}`;
  }

  // Inicializar
  render();
</script>

</body>
</html>
